name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [ ccr-d42df807-n1gk9p ]
    paths:
      - android/**
      - .github/workflows/build-apk.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Steam-Giveaway-Catcher.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Steam-Giveaway-Catcher-apk
          path: Steam-Giveaway-Catcher.apk
          if-no-files-found: error

      - name: Commit APK to repo
        run: |
          mkdir -p releases
          cp Steam-Giveaway-Catcher.apk releases/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Steam-Giveaway-Catcher.apk
          git commit -m "APK: збірка ${GITHUB_SHA::7}" || echo "без змін"
          git push origin HEAD:${GITHUB_REF_NAME}
